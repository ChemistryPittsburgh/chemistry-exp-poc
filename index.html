<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expertise Spheres</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/site.css" />
    <style>
      main { max-width: 1200px; margin: 0 auto; padding: 120px 16px 120px; }
      h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 700; text-transform: uppercase; margin: 0 0 8px; }
      p.lede { color: var(--muted); margin: 0 0 32px; max-width: 640px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr));
        gap: 20px;
      }
      figure {
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 40%, #24221f 0%, var(--card) 65%);
      }
      .stage { position: relative; aspect-ratio: 1; cursor: grab; touch-action: pan-y; }
      .stage:active { cursor: grabbing; }
      .ref {
        position: absolute; right: 12px; bottom: 12px; width: 84px; height: 84px; z-index: 2;
        border-radius: 8px; border: 1px solid var(--line); opacity: 0.9; pointer-events: none;
      }
      figcaption {
        display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
        padding: 14px 16px; border-top: 1px solid var(--line); background: var(--card);
        position: relative; z-index: 2;
      }
      figcaption b { text-transform: uppercase; font-size: 14px; letter-spacing: 0.02em; }
      figcaption span { color: var(--muted); font-size: 13px; text-align: right; }
      .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Expertise spheres</h1>
      <p class="lede">The four spheres, modeled in Blender and exported as compressed GLBs, drawn by one shared WebGL renderer. Drag to turn and tilt. The thumbnail in each corner is the original design render.</p>
      <div class="grid" id="grid"></div>
    </main>
    <script type="module">
      import { Stage } from './src/stage.js';
      import { SPHERES, loadSphere } from './src/models.js';
      import { mountNav } from './src/nav.js';

      mountNav('gallery');
      const refs = { puffer: 'puffer', tennis: 'tennis', eightball: 'eight-ball', robot: 'robot' };
      const stage = new Stage();
      const grid = document.getElementById('grid');
      for (const s of SPHERES) {
        const fig = document.createElement('figure');
        fig.innerHTML = `<div class="stage"><div class="loading">Loading…</div><img class="ref" src="reference/${refs[s.id]}.png" alt="Design reference" /></div>
          <figcaption><b>${s.title}</b><span>${s.line}</span></figcaption>`;
        grid.appendChild(fig);
        const el = fig.querySelector('.stage');
        const view = stage.addView(el, null, { spin: 0.9 });
        loadSphere(s.id).then((rig) => {
          stage.setObject(view, rig);
          el.querySelector('.loading').remove();
          // Click (not drag) to interact, e.g. shake the 8-ball for a new reveal.
          let down = null;
          el.addEventListener('pointerdown', (e) => (down = [e.clientX, e.clientY]));
          el.addEventListener('click', (e) => {
            if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 6) rig.userData.activate();
          });
        });
      }
    </script>
  </body>
</html>
